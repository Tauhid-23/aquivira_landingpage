<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
  <defs>
    <linearGradient id="abInfinityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E84D70"/>
      <stop offset="35%" stop-color="#C05697"/>
      <stop offset="65%" stop-color="#5B86C5"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="abSubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Left: Concentric Infinity Loops -->
  <g transform="translate(18, 25)">
    <!-- 4 concentric infinity tracks -->
    <!-- Outer loop -->
    <path d="M42 38 C22 38 8 26 8 16 C8 6 22 2 35 12 L73 44 C86 54 100 50 100 40 C100 30 86 18 66 18 C86 18 100 30 100 40 C100 50 86 54 73 44 L35 12 C22 2 8 6 8 16 C8 26 22 38 42 38 Z" 
          fill="none" stroke="url(#abInfinityGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mid-outer loop -->
    <path d="M42 34 C26 34 14 24 14 16 C14 8 25 5 36 14 L72 42 C83 51 94 48 94 40 C94 32 83 22 66 22" 
          fill="none" stroke="url(#abInfinityGrad)" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
    
    <!-- Mid-inner loop -->
    <path d="M42 30 C30 30 20 22 20 16 C20 10 28 8 37 16 L71 40 C80 48 88 46 88 40 C88 34 80 26 66 26" 
          fill="none" stroke="url(#abInfinityGrad)" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
          
    <!-- Inner loop -->
    <path d="M42 26 C34 26 26 20 26 16 C26 12 31 11 38 18 L70 38 C77 45 82 44 82 40 C82 36 77 30 66 30" 
          fill="none" stroke="url(#abInfinityGrad)" stroke-width="1.8" opacity="0.7" stroke-linecap="round"/>
          
    <!-- Center pulse core -->
    <circle cx="54" cy="28" r="3.5" fill="#5B86C5"/>
  </g>

  <!-- Divider -->
  <line x1="140" y1="20" x2="140" y2="105" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right: Official Typography -->
  <g transform="translate(155, 18)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="20" rx="5" fill="url(#abSubGrad)"/>
    <text x="85" y="14" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NATIONAL ACCELERATOR</text>
    
    <!-- Title -->
    <text x="0" y="42" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155" letter-spacing="4">ACCELERATING</text>
    <text x="0" y="64" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="1.2">BANGLADESH</text>
    
    <!-- Subtitle / Backers -->
    <text x="0" y="82" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0284C7" letter-spacing="0.8">POWERED BY DEIED • BHTPA</text>
    <text x="0" y="96" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.4">World Bank &amp; ICT Division Initiative</text>
  </g>
</svg>