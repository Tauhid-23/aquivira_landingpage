<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
  <defs>
    <linearGradient id="uihpBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Left: Official BHTPA Circuit Towers -->
  <g transform="translate(18, 18)">
    <!-- Tall Tower (right) -->
    <rect x="42" y="24" width="38" height="66" rx="2" fill="none" stroke="#00875A" stroke-width="2.5"/>
    <rect x="49" y="16" width="24" height="8" rx="1.5" fill="none" stroke="#00875A" stroke-width="2"/>
    <rect x="55" y="10" width="12" height="6" rx="1" fill="none" stroke="#00875A" stroke-width="2"/>
    <line x1="61" y1="5" x2="61" y2="10" stroke="#00875A" stroke-width="2"/>

    <!-- Small Tower (left) -->
    <rect x="12" y="44" width="30" height="46" rx="2" fill="none" stroke="#00875A" stroke-width="2.5"/>
    <line x1="27" y1="38" x2="27" y2="44" stroke="#00875A" stroke-width="2"/>
    
    <!-- Wi-Fi / Antenna Signal waves (red) -->
    <circle cx="27" cy="38" r="1.5" fill="#E53935"/>
    <path d="M22 35 A 6 6 0 0 1 32 35" fill="none" stroke="#E53935" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M18 31 A 11 11 0 0 1 36 31" fill="none" stroke="#E53935" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Circuit lines & nodes inside towers -->
    <!-- Left tower circuits -->
    <path d="M19 80 V 56 H 26 V 50" fill="none" stroke="#00875A" stroke-width="1.5"/>
    <circle cx="26" cy="50" r="2" fill="#00875A"/>
    <path d="M34 82 V 64 H 28" fill="none" stroke="#00875A" stroke-width="1.5"/>
    <circle cx="28" cy="64" r="2" fill="#00875A"/>
    <circle cx="19" cy="80" r="2" fill="#00875A"/>
    
    <!-- Right tower circuits -->
    <path d="M52 82 V 48 H 60 V 38" fill="none" stroke="#00875A" stroke-width="1.5"/>
    <circle cx="60" cy="38" r="2" fill="#00875A"/>
    <path d="M68 82 V 58 H 60 V 70" fill="none" stroke="#00875A" stroke-width="1.5"/>
    <circle cx="60" cy="70" r="2" fill="#00875A"/>
    <path d="M72 40 V 30 H 64" fill="none" stroke="#00875A" stroke-width="1.5"/>
    <circle cx="64" cy="30" r="2" fill="#00875A"/>
  </g>

  <!-- Divider -->
  <line x1="120" y1="20" x2="120" y2="105" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right: Official BHTPA + UIHP Typography -->
  <g transform="translate(136, 18)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="20" rx="5" fill="url(#uihpBadgeGrad)"/>
    <text x="90" y="14" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">UIHP PRE-SEED WINNER</text>
    
    <!-- BHTPA Wordmark -->
    <text x="0" y="42" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#00875A" letter-spacing="3.8">BANGLADESH</text>
    <text x="0" y="60" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="900" fill="#E53935" letter-spacing="1.8">HI-TECH PARK</text>
    <text x="0" y="78" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#00875A" letter-spacing="4.5">AUTHORITY</text>
    
    <!-- Subtext -->
    <text x="0" y="96" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.4">University Innovation Hub Program • DEIED</text>
  </g>
</svg>