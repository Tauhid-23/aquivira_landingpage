    <path d="M0 6 C0 2.5 2.5 0 6 0 L16 0 C22 0 26 3.5 26 9 C26 13 23 16 19 17 C24 18 28 22 28 28 C28 34.5 23 38 16 38 L6 38 C2.5 38 0 35.5 0 32 Z M10 8 L10 15 L15 15 C17.5 15 19 13.5 19 11.5 C19 9.5 17.5 8 15 8 Z M10 22 L10 30 L16 30 C19 30 20.5 28.5 20.5 26 C20.5 23.5 19 22 16 22 Z" fill="url(#blueGrad)"/>
    
    <!-- Letter L -->
    <path d="M34 2 C34 1 35 0 36 0 L44 0 C45 0 46 1 46 2 L46 28 L59 28 C60.5 28 61.5 29 61.5 30.5 L61.5 36 C61.5 37.5 60.5 38 59 38 L36 38 C35 38 34 37 34 36 Z" fill="url(#blueGrad)"/>
    
    <!-- Letter U -->
    <path d="M68 2 C68 1 69 0 70 0 L78 0 C79 0 80 1 80 2 L80 23 C80 27 82 29 86 29 C90 29 92 27 92 23 L92 2 C92 1 93 0 94 0 L102 0 C103 0 104 1 104 2 L104 23 C104 33 97 39 86 39 C75 39 68 33 68 23 Z" fill="url(#blueGrad)"/>
    
