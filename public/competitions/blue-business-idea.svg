    <path d="M86 38 L90 24 L94 38 L90 35 Z" fill="url(#amberGrad)"/>
    <circle cx="90" cy="22" r="2.5" fill="#FF9E1B"/>

    <!-- Letter E -->
    <path d="M111 2 C111 1 112 0 113 0 L136 0 C137.5 0 138.5 1 138.5 2.5 L138.5 8 C138.5 9.5 137.5 10 136 10 L123 10 L123 14 L133 14 C134.5 14 135.5 15 135.5 16.5 L135.5 21.5 C135.5 23 134.5 24 133 24 L123 24 L123 28 L137 28 C138.5 28 139.5 29 139.5 30.5 L139.5 36 C139.5 37.5 138.5 38 137 38 L113 38 C112 38 111 37 111 36 Z" fill="url(#blueGrad)"/>
    
    <!-- uplifting you -->
    <text x="70" y="58" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">uplifting you</text>
  </g>

  <!-- Divider line -->
  <line x1="178" y1="20" x2="178" y2="105" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right: Business Idea Competition text & Partners -->
  <g transform="translate(196, 20)">
    <rect x="0" y="0" width="180" height="22" rx="6" fill="#0260B5"/>
    <text x="90" y="15" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">CHAMPION • 1ST PLACE</text>
    
    <text x="0" y="42" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" letter-spacing="-0.2">Business Idea</text>
    <text x="0" y="60" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0260B5" letter-spacing="-0.2">Competition</text>
    
    <g transform="translate(0, 75)">
      <circle cx="5" cy="6" r="3" fill="#00A3E0"/>
      <text x="12" y="10" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">WaterAid</text>
      <text x="64" y="10" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="10" fill="#94A3B8">•</text>
