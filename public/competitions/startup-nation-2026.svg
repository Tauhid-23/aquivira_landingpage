<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
  <defs>
    <linearGradient id="snGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="snGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="snRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Left: Emblem with Star & Rocket / Top 6 Badge -->
  <g transform="translate(25, 20)">
    <!-- Hexagonal Crest -->
    <polygon points="45,0 85,22 85,68 45,90 5,68 5,22" fill="url(#snGreen)" stroke="#059669" stroke-width="2"/>
    <polygon points="45,6 78,25 78,65 45,84 12,65 12,25" fill="#022c22"/>
    
    <!-- Red circle center (National Flag homage) -->
    <circle cx="45" cy="45" r="22" fill="url(#snRed)"/>
    
    <!-- Dynamic Tech Rocket / Rising Arrow -->
    <path d="M45 27 L53 50 L45 46 L37 50 Z" fill="#FFFFFF"/>
    <polygon points="45,30 48,46 45,43 42,46" fill="#FBBF24"/>
    
    <!-- Six Golden Stars (Top 6 Team) -->
    <!-- Star 1 -->
    <circle cx="45" cy="14" r="3" fill="url(#snGold)"/>
    <!-- Star 2 -->
    <circle cx="68" cy="27" r="2.5" fill="url(#snGold)"/>
    <!-- Star 3 -->
    <circle cx="68" cy="63" r="2.5" fill="url(#snGold)"/>
    <!-- Star 4 -->
    <circle cx="45" cy="76" r="3" fill="url(#snGold)"/>
    <!-- Star 5 -->
    <circle cx="22" cy="63" r="2.5" fill="url(#snGold)"/>
    <!-- Star 6 -->
    <circle cx="22" cy="27" r="2.5" fill="url(#snGold)"/>
  </g>

  <!-- Divider -->
  <line x1="135" y1="20" x2="135" y2="105" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Right: Typography & Milestones -->
  <g transform="translate(150, 18)">
    <!-- Top 6 Pill Badge -->
    <rect x="0" y="0" width="165" height="20" rx="5" fill="url(#snGold)"/>
    <text x="82" y="14" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="1">★ TOP 6 TEAM FINALIST ★</text>
    
    <!-- Title -->
    <g transform="translate(0, 42)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="16" font-weight="900" fill="#0F172A" letter-spacing="0.5">STARTUP NATION</text>
      <text x="160" y="0" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="17" font-weight="900" fill="#DC2626">2026</text>
    </g>
    
    <!-- Description lines -->
    <text x="0" y="66" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="0.2">National Innovation Challenge</text>
    <text x="0" y="82" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.3">Recognized Among Bangladesh's Top 6 Startups</text>
    <text x="0" y="96" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8">Premier National Tech &amp; Venture Summit</text>
  </g>
</svg>